name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # La clave de firma se genera UNA vez acá y queda guardada en el repo,
      # cifrada con el secret KEYSTORE_PASSWORD (que nunca sale de GitHub).
      # Sin ese secret, el APK se firma con la clave de debug: sirve para probar,
      # pero no se puede instalar encima de una versión firmada con la clave real.
      - name: Clave de firma
        id: sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Falta el secret KEYSTORE_PASSWORD: APK firmado con clave de debug (solo para probar)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f signing/release.jks ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" != "push" -a "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "::warning::Todavía no hay clave; se crea en el próximo push a main."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            mkdir -p signing
            keytool -genkeypair -keystore signing/release.jks -storetype PKCS12 \
              -alias brainrotless -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Brainrotless"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/release.jks
            git commit -m "Crear clave de firma [skip ci]"
            git push origin HEAD:main
          fi
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/release.jks" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Versión
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then TAG="${{ github.event.release.tag_name }}";
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME";
          else TAG=""; fi
          if [ -n "$TAG" ]; then
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Brainrotless-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Brainrotless-${{ env.VERSION_NAME }}
          path: Brainrotless-*.apk

      - name: Publicar en Releases
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.sign.outputs.enabled }}" != "true" ]; then
            echo "::error::No publico un release sin la clave real: configurá el secret KEYSTORE_PASSWORD."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Brainrotless-*.apk --clobber
          else
            gh release create "$RELEASE_TAG" Brainrotless-*.apk --title "Brainrotless $VERSION_NAME" --generate-notes
          fi
